# Local stack: web, API, and Postgres with pgvector.
# Defaults are for a developer machine only. Copy .env.example to .env to override them.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditmaster}
      POSTGRES_DB: ${POSTGRES_DB:-auditmaster}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditmaster} -d ${POSTGRES_DB:-auditmaster}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditmaster}:${POSTGRES_PASSWORD:-auditmaster}@db:5432/${POSTGRES_DB:-auditmaster}
      FAKE_MODELS: ${FAKE_MODELS:-true}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://localhost:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-dev}
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER_URL: ${RERANKER_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
