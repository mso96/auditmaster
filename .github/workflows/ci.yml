name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auditmaster
          POSTGRES_PASSWORD: auditmaster
          POSTGRES_DB: auditmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditmaster -d auditmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://auditmaster:auditmaster@localhost:5432/auditmaster
      TEST_DATABASE_URL: postgresql://auditmaster:auditmaster@localhost:5432/auditmaster
      REQUIRE_DATABASE: "1"
      FAKE_MODELS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
